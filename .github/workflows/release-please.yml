name: Release Please

"on":
  push:
    branches: [main]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/release-please.yml@94d7adb43db9ddd7222ad25834231ac41314359b  # main
    with:
      app-id: ${{ vars.RELEASE_APP_ID }}
      sync-uv-lock: false
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
