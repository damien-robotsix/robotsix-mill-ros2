---
name: DCO

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO
    permissions:
      contents: read  # check out the PR commits to inspect their trailers
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check DCO
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          echo "Checking DCO for commits ${BASE_SHA}..${HEAD_SHA}"

          COMMITS=$(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}" || true)
          if [ -z "$COMMITS" ]; then
            echo "No commits to check — DCO passes vacuously"
            exit 0
          fi

          FAILED=0
          for commit in $COMMITS; do
            author=$(git log -1 --format='%ae' "$commit")
            subject=$(git log -1 --format='%s' "$commit")

            # Exempt robotsix.local authors and GitHub App bots
            # (release-please, dependabot). Bot commits are machine-generated
            # and cannot carry a human Signed-off-by trailer; their author is
            # of the form <id>+<app>[bot]@users.noreply.github.com.
            case "$author" in
              *@robotsix.local | *'[bot]'@users.noreply.github.com)
                echo "OK (exempt): $commit $subject ($author)"
                continue
                ;;
            esac

            signoff=$(git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$commit" || true)

            if [ -z "$signoff" ]; then
              echo "FAIL: $commit $subject — missing Signed-off-by"
              FAILED=1
              continue
            fi

            # Extract email(s) from the Signed-off-by trailer(s) and
            # require at least one to match the commit author email.
            if printf '%s\n' "$signoff" | sed -n 's/.*<\([^>]*\)>.*/\1/p' | grep -qFx "$author"; then
              echo "OK: $commit $subject"
            else
              echo "FAIL: $commit $subject — no Signed-off-by matches author email $author"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "DCO check failed: $FAILED commit(s) lack a Signed-off-by trailer"
            exit 1
          fi
          echo "DCO check passed"
