name: Lint workflows

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"

# Job-scoped below: a caller-level grant cannot exceed what the job allows,
# and the reusable workflow only needs read access to check out the repo.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: Lint workflows
    permissions:
      contents: read  # check out the workflow files to lint them
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/lint-workflows.yml@a123d5f5386a32d171ef189b6d2a58bab5c7708f  # v1.0.5
    with:
      run-actionlint: true
      run-zizmor: true
