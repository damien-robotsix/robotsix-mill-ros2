---
name: CI

"on":
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    permissions: {}
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: YAML Lint
            recipe: lint-yaml
            pip: yamllint
          - name: ShellCheck
            recipe: lint-shell
            apt: shellcheck
          - name: VCS Validate
            recipe: validate-manifest
            pip: vcs2l
          - name: Codespell
            recipe: lint-spelling
            pip: codespell
          - name: Markdown Lint
            recipe: lint-markdown
            npm: markdownlint-cli
          - name: Actionlint
            recipe: lint-actions
            actionlint: true
          - name: Docker Lint
            recipe: lint-docker
            hadolint: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just
      - name: Install pip tool
        if: ${{ matrix.pip }}
        run: pip install ${{ matrix.pip }}
      - name: Install apt tool
        if: ${{ matrix.apt }}
        run: sudo apt-get install -y ${{ matrix.apt }}
      - name: Install npm tool
        if: ${{ matrix.npm }}
        run: sudo npm install -g ${{ matrix.npm }}
      - name: Install actionlint
        if: ${{ matrix.actionlint }}
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo mv actionlint /usr/local/bin/
      - name: Install hadolint
        if: ${{ matrix.hadolint }}
        run: |
          curl -sSfL https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 \
            -o hadolint && chmod +x hadolint && sudo mv hadolint /usr/local/bin/
      - name: Run linter
        run: just ${{ matrix.recipe }}

  zizmor:
    permissions: {}
    name: Zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02  # v0.6.0
        with:
          advanced-security: "false"
          annotations: "true"

  pre-commit:
    permissions: {}
    name: Pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.x"
      - name: Install vcs2l (needed for vcs-validate pre-commit hook)
        run: pip install vcs2l
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1
        with:
          extra_args: --all-files --verbose
