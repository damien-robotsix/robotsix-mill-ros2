---
name: CI

"on":
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    permissions: {}
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: YAML Lint
            recipe: lint-yaml
            pip: yamllint
            version: "1.38.0"
          - name: ShellCheck
            recipe: lint-shell
            shellcheck: true
            version: "0.11.0"
          - name: VCS Validate
            recipe: validate-manifest
            pip: vcs2l
            version: "1.1.7"
          - name: Codespell
            recipe: lint-spelling
            pip: codespell
            version: "2.4.3"
          - name: Markdown Lint
            recipe: lint-markdown
            npm: markdownlint-cli
            version: "0.49.1"
          - name: Actionlint
            recipe: lint-actions
            actionlint: true
            version: "1.7.12"
          - name: Docker Lint
            recipe: lint-docker
            hadolint: true
            version: "2.14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just
      - name: Install pip tool
        if: ${{ matrix.pip }}
        run: pip install ${{ matrix.pip }}==${{ matrix.version }}
      - name: Install shellcheck
        if: ${{ matrix.shellcheck }}
        run: |
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${{ matrix.version }}/shellcheck-v${{ matrix.version }}.linux.x86_64.tar.xz" \
            -o shellcheck.tar.xz
          tar -xf shellcheck.tar.xz
          sudo mv "shellcheck-v${{ matrix.version }}/shellcheck" /usr/local/bin/
          rm -rf shellcheck.tar.xz "shellcheck-v${{ matrix.version }}"
      - name: Install npm tool
        if: ${{ matrix.npm }}
        run: sudo npm install -g ${{ matrix.npm }}@${{ matrix.version }}
      - name: Install actionlint
        if: ${{ matrix.actionlint }}
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) "${{ matrix.version }}"
          sudo mv actionlint /usr/local/bin/
      - name: Install hadolint
        if: ${{ matrix.hadolint }}
        run: |
          curl -sSfL "https://github.com/hadolint/hadolint/releases/download/v${{ matrix.version }}/hadolint-Linux-x86_64" \
            -o hadolint && chmod +x hadolint && sudo mv hadolint /usr/local/bin/
      - name: Run linter
        run: just ${{ matrix.recipe }}

  zizmor:
    permissions: {}
    name: Zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5  # v0.6.1
        with:
          version: "1.28.0"
          advanced-security: "false"
          annotations: "true"

  pre-commit:
    permissions: {}
    name: Pre-commit
    runs-on: ubuntu-24.04
    # Generous on purpose. A cold run installs every hook environment before
    # the first hook executes (~4m18s observed), and pre-commit/action only
    # saves its cache in a post-step. At the previous 5m this job was killed
    # before that step ran, so the cache was never written, so the next run
    # started cold too — every run from 2026-08-02 to 2026-08-07 was cancelled
    # at ~5m15s and the job had never once passed. Warm runs finish in well
    # under a minute; this ceiling only has to cover the cold one.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.x"
      - name: Install vcs2l (needed for vcs-validate pre-commit hook)
        run: pip install vcs2l==1.1.7
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1
        with:
          extra_args: --all-files --verbose
